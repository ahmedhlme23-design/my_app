<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تواصل معنا | ALS Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="home.html">
      <span class="brand-mark">ALS</span>
      <span>Media</span>
    </a>
    <nav class="nav-links">
      <a href="home.html">الرئيسية</a>
      <a href="portfolio.html">المشاريع</a>
      <a href="demos.html">التجارب</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html" class="active">تواصل معنا</a>
    </nav>
    <a class="btn btn-primary" href="contact.html">تواصل معنا</a>
  </header>

  <main>
    <section class="page-card">
      <p class="eyebrow">الرعايات والشراكات</p>
      <h1>تواصل معنا</h1>
      <p>للتعاون أو الرعاية أو الاستفسارات التجارية، املأ النموذج التالي وسنرد عليك في أقرب وقت.</p>
      <div class="form-card">
        <form>
          <div class="form-grid">
            <div class="form-group">
              <label>الاسم</label>
              <input type="text" placeholder="أدخل اسمك" />
            </div>
            <div class="form-group">
              <label>البريد الإلكتروني</label>
              <input type="email" placeholder="name@example.com" />
            </div>
            <div class="form-group full">
              <label>نوع الاستفسار</label>
              <select>
                <option>رعاية قناة يوتيوب</option>
                <option>حملة تطبيق أو موقع</option>
                <option>شراكة إستراتيجية</option>
              </select>
            </div>
            <div class="form-group full">
              <label>الرسالة</label>
              <textarea rows="5" placeholder="أخبرنا عن احتياجك..."></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="button">إرسال</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 ALS Media. جميع الحقوق محفوظة.</p>
  </footer>
</body>
</html>
