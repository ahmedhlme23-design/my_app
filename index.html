<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-card">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">اسم المستخدم:</label>
        <input type="text" id="username" required>
      </div>
      <div class="input-group">
        <label for="password">كلمة السر:</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">دخول</button>
      <button type="button" class="btn-secondary" id="openRegisterModal">إنشاء حساب جديد</button>
      <p id="errorMessage" class="error"></p>
    </form>
  </div>

  <!-- نافذة إنشاء حساب جديد (Modal) -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeRegisterModal">&times;</span>
      <h2>حساب جديد</h2>
      <form id="registerForm">
        <div class="input-group">
          <label for="regUsername">اسم المستخدم:</label>
          <input type="text" id="regUsername" required>
        </div>
        <div class="input-group">
          <label for="regPassword">كلمة السر:</label>
          <input type="password" id="regPassword" required>
        </div>
        <button type="submit">حفظ وتجميع</button>
        <p id="regMessage" class="msg"></p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
